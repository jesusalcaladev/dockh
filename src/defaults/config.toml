# dockh configuration — edit freely, dockh reloads it on the next start.
# Path: ~/.config/dockh/config.toml  (or $XDG_CONFIG_HOME/dockh/config.toml)
# Every option below has a matching CLI flag that overrides it.

[dock]
position = "bottom"      # bottom | top | left | right
alignment = "center"     # start | center | end
full = false             # take the full monitor edge
layer = "bottom"         # overlay | top | bottom (bottom = behind windows)
exclusive = false        # reserve space (forces layer = top)
autohide = false         # show on hotspot hover, hide on leave
hide_on_activity = false # intellihide: hide when the active workspace has windows
resident = false         # always visible; toggled via SIGRTMIN+1
icon_size = 48           # base icon size in px
num_workspaces = 10
target_output = ""       # e.g. "DP-1" — empty = focused monitor

[margins]
top = 0
bottom = 0
left = 0
right = 0

[launcher]
show = true
command = "nwg-drawer"
icon = ""
position = "end"         # start | end

[hotspot]
delay_ms = 20
layer = "overlay"
size = 0                 # 0 = auto (1/3 of the edge)

[animation]
scale = 1.5
duration_ms = 200
curve = "cubic-bezier(0.34, 1.56, 0.64, 1)"

[magnify]
# macOS proximity magnification: icons scale by distance to cursor
enabled = true
spread = 3               # effect radius in icon slots from the cursor
falloff = 0.24           # curve sharpness: lower = sharper peak
steps = 256              # bucket ladder size: 256 = sub-pixel, smooth
duration_ms = 40
spring = true
spring_strength = 0.06

[island]
# Dynamic Island: floating notification/music widget at top of screen
enabled = true

[progress]
# Media progress bar under the playing app icon (requires playerctl)
enabled = false

[badge]
# Notification counter on app icons (requires mako + makoctl)
enabled = true
threshold = 5

[system]
# System monitor in right-click context menu (RAM / CPU / temperature)
enabled = false
interval_ms = 2000
dock = false
ram = true
cpu = true
temp = true

[glow]
enabled = false
radius = 8

[appearance]
icon_shadow = false
icon_shadow_radius = 8

[apps]
css_file = "style.css"
pinned = []
ignore_classes = []
ignore_workspaces = []
